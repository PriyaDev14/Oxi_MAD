<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="light"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PulseOx"><title>Physiology-Aware Adaptive Control</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
color-scheme:light;--bg:#ffffff;--card:#fff;--tx:#111827;--mut:#6b7c93;--line:#e5e9f0;--blue:#1e3a9f;--red:#e11d48;--green:#15803d;--sp:#1d4ed8;--band:rgba(21,128,61,.10)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
main{max-width:560px;margin:0 auto;padding:16px 14px 32px;display:flex;flex-direction:column;gap:14px}
h1{font-size:18px;text-align:center;margin:8px 0 0;letter-spacing:.5px}
.sub{text-align:center;color:var(--mut);font-size:11px;letter-spacing:2px;margin:-8px 0 4px}
.card{background:var(--card);border-radius:18px;padding:14px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.lbl{font-size:11px;letter-spacing:3px;color:var(--mut);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px}
canvas{width:100%;display:block}
#pleth{height:240px}#env{height:200px}
.stable{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;text-align:center;font-weight:700;letter-spacing:3px;color:var(--green);font-size:13px}
.stable.warn{color:#d97706}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:30%;background:#1d6bf3;transition:width .5s}
.big{display:flex;align-items:center;gap:14px;font-size:54px;font-weight:800;line-height:1.1}
.big .ico{font-size:40px}
#bpm{color:var(--red)}#spo2{color:var(--sp)}#bat{color:var(--green)}
.batt{display:flex;align-items:center}
.batt .body{display:flex;gap:4px;padding:4px;border:3px solid var(--green);border-radius:6px;width:76px;height:38px}
.batt .body b{flex:1;background:var(--green);border-radius:2px}
.batt .body b.off{opacity:.15}
.batt .tip{width:5px;height:16px;background:var(--green);border-radius:0 3px 3px 0}
.leg{display:flex;gap:12px;font-size:10px;color:var(--mut);margin-top:4px;justify-content:center}
.leg span::before{content:"";display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle;background:currentColor}
</style></head>
<body><main>
<h1>Physiology-Aware Adaptive Control</h1>
<div class="sub">for Energy-Optimized Pulse Oximetry</div>

<section class="card"><div class="lbl">PLETH</div><canvas id="pleth"></canvas></section>

<section class="card"><div class="lbl">PREDICTION ENVELOPE</div><canvas id="env"></canvas>
<div class="leg"><span style="color:#dc2626">Upper</span><span style="color:var(--tx)">Predicted</span><span style="color:#16a34a">Lower</span></div>
<div class="stable" id="state">● STABLE</div>
<div class="lbl" style="border:0;margin:12px 0 0;padding:0">CONFIDENCE</div><div class="bar"><i id="conf"></i></div></section>

<section class="card"><div class="lbl">BPM</div><div class="big"><span class="ico">❤️</span><span id="bpm">--</span></div></section>
<section class="card"><div class="lbl">SPO₂ %</div><div class="big"><span class="ico">🩸</span><span id="spo2">--</span></div></section>
<section class="card"><div class="lbl">BATTERY %</div><div class="big batt"><div class="body" id="cells"><b></b><b></b><b></b><b></b></div><div class="tip"></div>&nbsp;<span id="bat">91%</span></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function setup(c){const d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.scale(d,d);return{x,w:r.width,h:r.height}}

// ---- Simulated sensor (replace with BLE/serial samples in production) ----
const FS=100,N=600;let buf=new Array(N).fill(0),phase=0,hr=72,target=72,beat=500;
const rrHist=[],predH=[],loH=[],hiH=[];let bpmShown=72,conf=25,battery=91,widen=0;
function sample(){
  const p=phase;let v;
  if(p<0.1)v=1150*Math.sin(p/0.1*Math.PI/2);
  else{const t=(p-0.1)/0.9;
    v=1150*Math.exp(-3.0*t)+110*Math.exp(-Math.pow((t-0.38)/0.07,2))-30*t;
    v+=(Math.random()-.5)*(t<.15?10:40)*Math.min(1,t*3);}
  return Math.max(0,Math.min(1000,v));
}
function onBeat(){
  if(Math.random()<.15)target=Math.max(55,Math.min(110,target+(Math.random()-.5)*8));
  hr+=(target-hr)*.3;
  const rr=60/hr,pred=(predH.length?predH[predH.length-1]:rr);
  const err=Math.abs(rr-pred);
  widen=Math.max(0,widen-1);if(err>0.02)widen=4;
  const m=widen>0?0.02:0.008;
  rrHist.push(rr);predH.push(rr);hiH.push(rr+m);loH.push(rr-m);
  if(rrHist.length>60){rrHist.shift();predH.shift();hiH.shift();loH.shift()}
  beat++;
  bpmShown=bpmShown*.5+hr*.5;
  conf=widen>0?Math.max(15,conf-12):Math.min(95,conf+4);
  $('bpm').textContent=bpmShown.toFixed(1);
  $('spo2').textContent=Math.round(97+Math.random()*2.4);
  $('conf').style.width=conf+'%';
  const s=$('state');s.textContent=widen>0?'● ADAPTING':'● STABLE';s.classList.toggle('warn',widen>0);
  drawEnv();
}
setInterval(()=>{battery=Math.max(1,battery-.1);$('bat').textContent=Math.round(battery)+'%';
  [...$('cells').children].forEach((c,i)=>c.classList.toggle('off',battery<=i*25))},6000);

// ---- Pleth ----
let P=setup($('pleth'));
function drawPleth(){
  const{x,w,h}=P,L=38,B=18,T=8,W=w-L-4,H=h-B-T;
  x.clearRect(0,0,w,h);x.font='10px monospace';x.fillStyle=css('--mut');x.strokeStyle=css('--line');x.lineWidth=1;
  for(let v=0;v<=1000;v+=200){const y=T+H*(1-v/1000);x.beginPath();x.moveTo(L,y);x.lineTo(w-4,y);x.stroke();x.fillText(v,2,y+3)}
  x.strokeStyle=css('--blue');x.lineWidth=2;x.lineJoin='round';x.beginPath();
  buf.forEach((v,i)=>{const px=L+W*i/(N-1),py=T+H*(1-v/1000);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
}
let last=performance.now(),acc=0;
function loop(t){
  acc+=(t-last)/1000;last=t;
  while(acc>=1/FS){acc-=1/FS;phase+=hr/60/FS;if(phase>=1){phase-=1;onBeat()}buf.push(sample());buf.shift()}
  drawPleth();requestAnimationFrame(loop)}

// ---- Prediction envelope ----
let E=setup($('env'));
function drawEnv(){
  const{x,w,h}=E,L=42,B=30,T=8,R=8,W=w-L-R,H=h-B-T,n=predH.length;if(n<2)return;
  let lo=Math.min(...loH)-.005,hi=Math.max(...hiH)+.005;
  const X=i=>L+W*i/59,Y=v=>T+H*(1-(v-lo)/(hi-lo));
  x.clearRect(0,0,w,h);x.font='10px monospace';x.fillStyle=css('--mut');x.strokeStyle=css('--line');x.lineWidth=1;
  for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3,y=Y(v);x.beginPath();x.moveTo(L,y);x.lineTo(w-R,y);x.stroke();x.fillText(v.toFixed(2),2,y+3)}
  x.fillText('Beat #  ('+(beat-n+1)+' – '+beat+')',L+W/2-50,h-6);
  x.save();x.translate(10,T+H/2);x.rotate(-Math.PI/2);x.fillText('RR (s)',-14,0);x.restore();
  const step=(arr,c,wd)=>{x.strokeStyle=c;x.lineWidth=wd;x.beginPath();arr.forEach((v,i)=>{i?(x.lineTo(X(i),Y(arr[i-1])),x.lineTo(X(i),Y(v))):x.moveTo(X(i),Y(v))});x.stroke()};
  x.fillStyle=css('--band');x.beginPath();hiH.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));
  for(let i=n-1;i>=0;i--)x.lineTo(X(i),Y(loH[i]));x.fill();
  step(hiH,'#dc2626',1.5);step(loH,'#16a34a',1.5);step(predH,css('--tx'),2);
}
for(let i=0;i<30;i++){phase=Math.random();onBeat()}
addEventListener('resize',()=>{P=setup($('pleth'));E=setup($('env'));drawEnv()});
requestAnimationFrame(t=>{last=t;loop(t)});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
